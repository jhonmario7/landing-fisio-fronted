<header class="site-header">
  <div class="wrap site-header__row">
    <a class="brand" href="#top" (click)="closeMenu()">
      <img class="brand__icon" src="/images/icon.webp" alt="" />
      <span class="brand__text">
        <strong>{{ content.identity.businessName }}</strong>
        <small>{{ content.identity.brandTagline }}</small>
      </span>
    </a>

    <nav class="nav-links" [class.is-open]="isMenuOpen()">
      @for (link of navLinks; track link.fragment) {
        <a [href]="'#' + link.fragment" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <app-button variant="primary" size="sm" [href]="whatsappHref" target="_blank" class="header-cta">
      <app-icon name="whatsapp" [size]="16" />
      <span class="header-cta__label">{{ content.social.phoneDisplay }}</span>
    </app-button>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="nav-links"
      aria-label="Abrir menú"
    >
      <app-icon [name]="isMenuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</header>
