<section class="section">
  <div class="wrap" appRevealOnScroll>
    <app-section-header
      eyebrow="Lo que dicen mis pacientes"
      title="Testimonios"
      align="center"
    />

    @if (content.testimonials.length) {
      <div class="testimonials-grid">
        @for (testimonial of content.testimonials; track testimonial.id) {
          @if (testimonial.authorizedInWriting || testimonial.isPlaceholder) {
            <figure class="testimonial-card">
              @if (testimonial.photo; as photo) {
                <img
                  class="testimonial-card__photo"
                  [ngSrc]="photo.src"
                  [alt]="photo.alt"
                  [width]="photo.width"
                  [height]="photo.height"
                />
              }
              @if (testimonial.rating) {
                <div
                  class="testimonial-card__rating"
                  role="img"
                  [attr.aria-label]="testimonial.rating + ' de 5 estrellas'"
                >
                  @for (star of [1, 2, 3, 4, 5]; track star) {
                    <span aria-hidden="true" [class.is-filled]="star <= testimonial.rating!">★</span>
                  }
                </div>
              }
              <figcaption class="testimonial-card__author">{{ testimonial.authorName }}</figcaption>
              <blockquote>
                <p>“{{ testimonial.text }}”</p>
              </blockquote>
            </figure>
          }
        }
      </div>
    }

    <div class="testimonials-cta">
      <p>¿Ya tuviste tu valoración? Cuéntanos cómo te fue.</p>
      <app-button variant="ghost" [href]="reviewRequestHref" target="_blank">
        Comparte tu experiencia
      </app-button>
    </div>
  </div>
</section>
