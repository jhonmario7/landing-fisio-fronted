<section class="section alt">
  <div class="wrap" appRevealOnScroll>
    <app-section-header
      eyebrow="Cómo es la atención"
      title="Un proceso claro, paso a paso"
      align="center"
    />
    <ol class="process-steps">
      @for (step of content.careProcess; track step.title; let i = $index) {
        <li class="process-step">
          <span class="process-step__number">{{ i + 1 }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
