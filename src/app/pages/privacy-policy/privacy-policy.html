<main class="policy wrap">
  <h1>Política de tratamiento de datos personales</h1>
  <p class="policy__updated">Última actualización: {{ content.legal.dataPolicyLastUpdated }}</p>

  @for (section of content.legal.dataPolicySections; track section.heading) {
    <section class="policy__section">
      <h2>{{ section.heading }}</h2>
      @for (paragraph of section.paragraphs; track paragraph) {
        <p>{{ paragraph }}</p>
      }
    </section>
  }
</main>
